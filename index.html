<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme colour for mobile browsers -->
    <meta name="theme-color" content="#6a35b5" />

    <!-- Default title + description (overridden per-page by useSEO) -->
    <title>SHELAN | Nutritionist &amp; Lipedema Specialist</title>
    <meta
      name="description"
      content="Personalized nutrition plans and specialized Lipedema management with Shelan, certified nutritionist."
    />

    <!-- Robots default (overridden per-page by useSEO) -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- ── Font preloads — prevents FOUT for above-the-fold Arabic + Latin text ── -->
    <link
      rel="preload"
      href="/fonts/Cairo-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/Cairo-Bold.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/Amiri-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
